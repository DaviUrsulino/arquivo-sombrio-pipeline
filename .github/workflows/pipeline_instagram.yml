name: Pipeline Instagram - robo.estagiario

# Roda sozinho, do início ao fim: escolhe o assunto (GitHub, nunca repete —
# ver src/estudio_instagram/escolher_pauta.py), gera Reels + carrossel e
# publica direto na Instagram Graph API (ver ADR-0005). Ativado em 2026-10-15
# depois de 3 posts reais validados na mão (ver pautas/historico.json e
# docs/estudio-instagram.md).
#
# O histórico (`pautas/historico.json`) e a pauta gerada são commitados de
# volta no repositório no fim da run — sem isso, a próxima execução (runner
# novo, disco limpo) não saberia o que já foi publicado e repetiria post.
#
# Minutos quebrados pelo mesmo motivo do pipeline_dark.yml: evitar o pico de
# carga do agendador do GitHub Actions no início de cada hora.

on:
  # Sem `schedule`: quem dispara as 5 rodadas diárias é o instagram_maestro.yml, que vigia o relógio de Brasília
  # (o cron do GitHub atrasa horas ou não dispara). Rodada de venda: a das 19h. Ver src/estudio_instagram/maestro.py.
  workflow_dispatch:
    inputs:
      formato:
        description: 'vazio: venda na rodada das 22h UTC e notícia de ferramenta (pixel2) nas outras. Ou: pixel2 / venda / curto / aprofundado'
        required: false
        default: ''
      pauta:
        description: 'Caminho de uma pauta pronta no repositório (ex.: pautas/viral/openfilm.json). Vazio: gera sozinho'
        required: false
        default: ''
      repo:
        description: 'Forçar um repositório no formato pixel2 (dono/nome). Vazio: escolhe sozinho'
        required: false
        default: ''
      publicar:
        description: 'Publicar de verdade no Instagram (true/false)'
        required: false
        default: 'true'

concurrency:
  group: instagram-pipeline
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependências
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg
          pip install "python-dotenv>=1.0.0" edge-tts

      - name: Escreve os segredos no .env
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          INSTAGRAM_GRAPH_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GH_TOKEN_PARA_BUSCA: ${{ secrets.GITHUB_TOKEN }}  # token automático do Actions, só pra elevar o limite de busca no GitHub
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          printf 'ELEVENLABS_API_KEY=%s\nINSTAGRAM_GRAPH_TOKEN=%s\nINSTAGRAM_USER_ID=%s\nGITHUB_TOKEN=%s\nGEMINI_API_KEY=%s\nOPENROUTER_API_KEY=%s\nMISTRAL_API_KEY=%s\nAPIFY_TOKEN=%s\n' \
            "$ELEVENLABS_API_KEY" "$INSTAGRAM_GRAPH_TOKEN" "$INSTAGRAM_USER_ID" "$GH_TOKEN_PARA_BUSCA" "$GEMINI_API_KEY" "$OPENROUTER_API_KEY" "$MISTRAL_API_KEY" "$APIFY_TOKEN" > .env

      - name: Escolhe o assunto sozinho (nunca repete um repositório já publicado)
        id: pauta
        run: |
          PAUTA_PRONTA="${{ github.event.inputs.pauta }}"
          if [ -n "$PAUTA_PRONTA" ]; then
            echo "usando a pauta pronta $PAUTA_PRONTA"
            echo "arquivo=$PAUTA_PRONTA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOME="pautas/auto-$(date -u +%F)-${{ github.run_number }}.json"
          FORMATO="${{ github.event.inputs.formato }}"
          if [ -z "$FORMATO" ]; then
            # O cron do GitHub atrasa horas, então decide pela hora UTC real: a rodada de 22:13 UTC
            # (19h13 BRT, horário nobre) é o vídeo de venda; as outras quatro são notícia de ferramenta.
            HORA=$(date -u +%H)
            if [ "$HORA" -ge 22 ] || [ "$HORA" -lt 1 ]; then FORMATO=venda; else FORMATO=pixel2; fi
          fi
          echo "formato escolhido: $FORMATO"
          FORMATO_FLAG="--formato $FORMATO"
          REPO="${{ github.event.inputs.repo }}"
          if [ -n "$REPO" ]; then FORMATO_FLAG="--formato pixel2 --repo $REPO"; fi
          python -m src.estudio_instagram.escolher_pauta --saida "$NOME" $FORMATO_FLAG
          echo "arquivo=$NOME" >> "$GITHUB_OUTPUT"

      - name: Gera e publica
        run: |
          PUBLICAR="${{ github.event.inputs.publicar }}"
          FLAG=""
          if [ "${PUBLICAR:-true}" = "true" ]; then FLAG="--publicar"; fi
          python -m src.estudio_instagram.pipeline --pauta "${{ steps.pauta.outputs.arquivo }}" $FLAG

      - name: Guarda o Reels, o carrossel e o registro pra conferência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-${{ github.run_id }}
          path: |
            saida/instagram/*/reels.mp4
            saida/instagram/*/carrossel/*.png
            saida/instagram/*/registro.json
          retention-days: 14

      - name: Guarda o histórico e a pauta gerada (pra nunca repetir post)
        if: always()
        run: |
          git config user.name "estudio-automatico (bot)"
          git config user.email "actions@github.com"
          git add -A pautas/
          git diff --cached --quiet || git commit -m "chore: registra pauta ${{ steps.pauta.outputs.arquivo }} [skip ci]"
          # Duas rodadas podem terminar juntas e disputar o push (2026-10-19 perdeu o registro de um post): tenta de novo.
          for tentativa in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((tentativa * 4))
          done
          exit 1
