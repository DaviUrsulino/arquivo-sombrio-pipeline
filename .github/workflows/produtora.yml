name: Produtora - os vídeos novos do dia em rodízio pelos 66 estilos do Lemo-Opuscar

# Roda de madrugada na nuvem (PC do Davi desligado). Escreve o roteiro com a fórmula (só fatos), escolhe o próximo
# estilo do rodízio e o Claude Code (plano do Davi, via CLAUDE_CODE_OAUTH_TOKEN de `claude setup-token`) monta o
# vídeo com a skill do estilo. Se o MP4 passar na conferência, sobe para a release de mídia e entra na fila do
# maestro (pautas/viral/fila/), que publica DENTRO da grade. Nada é postado direto daqui.
# Ver src/estudio_instagram/diretor/produtora.py (segurança: o agente só recebe o roteiro já validado, nunca
# texto da internet, e roda com uma lista restrita de comandos).

on:
  schedule:
    # Davi, 04/11: produzir de madrugada, quando ele não está usando o Claude (o plano é o mesmo). 4 por noite,
    # uma atrás da outra (concurrency), cobrem as 3 rodadas do dia seguinte e sobra 1 no banco.
    - cron: '17 3 * * *'   # 00:17 em Brasília
    - cron: '17 5 * * *'   # 02:17
    - cron: '17 7 * * *'   # 04:17
    - cron: '17 9 * * *'   # 06:17
  workflow_dispatch:
    inputs:
      repo:
        description: 'dono/nome do repositório (vazio: assunto quente do dia)'
        required: false
        default: ''
      venda:
        description: 'vídeo de venda do Pack Estúdio (no automático sai sozinho quando o banco de venda está vazio)'
        type: boolean
        default: false
      estilo:
        description: 'slug do estilo (vazio: próximo do rodízio; ex.: brick-toy, pixel-rpg, esquete)'
        required: false
        default: ''

concurrency:
  group: produtora
  cancel-in-progress: false

jobs:
  produzir:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixa os textos privados (prompts) do repositório de segredos
        uses: actions/checkout@v4
        with:
          repository: DaviUrsulino/arquivo-sombrio-segredos
          ssh-key: ${{ secrets.SEGREDOS_DEPLOY_KEY }}
          path: segredos

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala ferramentas de vídeo
        run: |
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-noto fonts-noto-color-emoji
          pip install "python-dotenv>=1.0.0" edge-tts numpy
          npm install -g @anthropic-ai/claude-code

      - name: Instala a biblioteca Lemo-Opuscar e as skills
        run: |
          curl -fsSL https://raw.githubusercontent.com/lemomo-ai/lemo-opuscar/main/plugin/skills/lemo-opuscar/scripts/setup.sh -o /tmp/lemo-setup.sh
          sh /tmp/lemo-setup.sh
          sh /tmp/lemo-setup.sh deps
          npx --yes skills add PHANTOMTONYT/motion-design-skills --skill hand-drawn-cartoon 3d-toy-character kinetic-typography data-story-charts -g -y
          npx --yes skills add heygen-com/hyperframes --skill hyperframes -g -y

      - name: Escreve os segredos no .env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN_PARA_BUSCA: ${{ secrets.GITHUB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
        # vozes reserva (06/11): Gemini -> ElevenLabs -> Gradium -> Edge; segredo que não existir fica vazio e é pulado
        run: printf 'GEMINI_API_KEY=%s\nGITHUB_TOKEN=%s\nELEVENLABS_API_KEY=%s\nGRADIUM_API_KEY=%s\n' "$GEMINI_API_KEY" "$GH_TOKEN_PARA_BUSCA" "$ELEVENLABS_API_KEY" "$GRADIUM_API_KEY" > .env

      - name: Produz o vídeo
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # o gh sobe o MP4 para a release de mídia
          # sem LLM_SEM_CLAUDE: quando a cota grátis do Gemini acaba (aconteceu em 04/11 à noite), o roteiro e a escolha
          # de estilo caem no Claude (Sonnet, texto curto) em vez de derrubar a produção inteira
          LEMO_ANGLE: swiftshader  # runner sem GPU: three.js por software (senão os estilos 3D saem em branco)
          ENTRADA_REPO: ${{ inputs.repo }}      # por variável de ambiente, nunca colado no script (evita injeção)
          ENTRADA_ESTILO: ${{ inputs.estilo }}
          ENTRADA_VENDA: ${{ inputs.venda }}
        run: |
          set -- --fila
          if [ -n "$ENTRADA_REPO" ]; then set -- "$@" --repo "$ENTRADA_REPO"; else set -- "$@" --auto; fi
          if [ "$ENTRADA_VENDA" = "true" ]; then set -- "$@" --venda; fi
          if [ -n "$ENTRADA_ESTILO" ]; then set -- "$@" --estilo "$ENTRADA_ESTILO"; fi
          python -m src.estudio_instagram.diretor.produtora "$@"

      - name: Guarda folha de quadros e log do agente (para conferir depois)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produtora
          path: |
            videos_produzidos/*/final.mp4
            videos_produzidos/*/folha.jpg
            videos_produzidos/*/poster.jpg
            videos_produzidos/*/agente.log
            videos_produzidos/*/producao.json
            videos_produzidos/*/roteiro.md
          if-no-files-found: ignore

      - name: Registra rodízio e fila no repositório
        if: always()
        run: |
          git config user.name "estudio-automatico"
          git config user.email "actions@users.noreply.github.com"
          for f in pautas/produtora.json pautas/em_alta_usados.json pautas/viral/fila pautas/viral/fila_venda; do if [ -e "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "chore: produtora registra vídeo do dia [skip ci]"
            git pull --rebase --autostash -q && git push -q
          fi
