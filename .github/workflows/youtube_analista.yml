name: YouTube analista - mede os dois canais todo dia e grita se algum ficar mudo

# 12/11 (Davi): "você tem que acompanhar todo dia". Roda às 08:35 em Brasília (a sessão dele já renovou, e isto não
# gasta Claude: só a YouTube Data API). Grava pautas/youtube/desempenho.json (views por molde, contra a linha de base
# "foto (antigo)") e fica VERMELHO se um canal passou de 26 h sem publicar: foi assim que o silêncio de 12/11 passou
# 12 h despercebido.

on:
  schedule:
    - cron: '35 11 * * *'
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar credenciais das APIs
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON_TENDENCIAS: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON_TENDENCIAS }}
          YOUTUBE_TOKEN_JSON_TENDENCIAS: ${{ secrets.YOUTUBE_TOKEN_JSON_TENDENCIAS }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
          echo "$YOUTUBE_CLIENT_SECRET_JSON_TENDENCIAS" > client_secret_tendencias.json
          echo "$YOUTUBE_TOKEN_JSON_TENDENCIAS" > token_tendencias.json
      - name: Mede e confere o silêncio
        id: medir
        continue-on-error: true
        run: python scripts/medir_youtube.py --alerta-horas 26
      - name: Registra o desempenho
        run: |
          git config user.name "estudio-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add pautas/youtube/desempenho.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: youtube analista registra desempenho [skip ci]"
            git pull --rebase --autostash -q && git push -q
          fi
      - name: Falha se algum canal ficou mudo
        if: steps.medir.outcome == 'failure'
        run: exit 1
