name: Pipeline Dark - geração e publicação automática

# Roda de graça no GitHub Actions, sem precisar do PC ligado. Cron em UTC
# (BRT = UTC-3). Duas contas alternando ao longo do dia, 10 vídeos/dia no
# total (5 cada) — acima da cota garantida do Cloudflare (~6-7/dia com boa
# qualidade), o excedente cai no fallback Pollinations automaticamente.
#   - "Arquivo Sombrio" (terror -- histórias reais/baseadas em fatos reais/
#     teoria da conspiração, ver canais/terror.py): 5x/dia
#   - "Em Alta" (tendências): 5x/dia
on:
  schedule:
    # Ajuste 2026-09-11 (pedido do Davi: "4 vídeos por canal"): de 5 pra 4
    # publicações/dia por conta, mesmo espaçamento ao longo do dia.
    #
    # Ajuste 2026-09-11 (2ª rodada, mesmo dia): cron batendo EXATO em cima
    # da hora ("0 12 * * *" etc) cai no horário de pico de congestionamento
    # do agendador do GitHub Actions -- a doc deles avisa isso ("High load
    # times include, for example, the start of every hour") e na prática
    # duas execuções do dia (12h e 14h UTC) simplesmente sumiram, nem
    # chegaram a rodar, enquanto outras atrasaram horas. Desloca todos os
    # minutos pra fora da hora cheia (:07, :13, :23, :37) reduz a chance de
    # cair nesse pico.
    - cron: '7 12 * * *'   # ~09h07 BRT - arquivo_sombrio
    - cron: '13 16 * * *'  # ~13h13 BRT - arquivo_sombrio
    - cron: '23 20 * * *'  # ~17h23 BRT - arquivo_sombrio
    - cron: '37 0 * * *'   # ~21h37 BRT - arquivo_sombrio
    - cron: '7 14 * * *'   # ~11h07 BRT - tendencias
    - cron: '13 18 * * *'  # ~15h13 BRT - tendencias
    - cron: '23 22 * * *'  # ~19h23 BRT - tendencias
    - cron: '37 2 * * *'   # ~23h37 BRT - tendencias
  workflow_dispatch:
    inputs:
      canal:
        description: 'Conta/canal (arquivo_sombrio ou tendencias)'
        required: false
        default: 'arquivo_sombrio'
      publicar:
        description: 'Publicar de verdade nas plataformas (true/false)'
        required: false
        default: 'true'
      roteiro_json:
        description: 'Caminho de um roteiro.json pronto no repo (opcional, pula geração via IA)'
        required: false
        default: ''

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar ffmpeg
        # `|| true` no update: um repositório que nem usamos (ex: Chrome,
        # pré-configurado na imagem do runner) pode falhar o hash-check e
        # travar TODO o job via `&&` mesmo com o índice do ffmpeg atualizado
        # -- aconteceu de verdade 2026-09-09, quebrando execuções reais.
        run: sudo apt-get update || true; sudo apt-get install -y ffmpeg

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Decidir qual conta roda nesta execução
        id: conta
        run: |
          if [ -n "${{ github.event.inputs.canal }}" ]; then
            CANAL="${{ github.event.inputs.canal }}"
          else
            case "${{ github.event.schedule }}" in
              '7 14 * * *'|'13 18 * * *'|'23 22 * * *'|'37 2 * * *') CANAL="tendencias" ;;
              *) CANAL="arquivo_sombrio" ;;
            esac
          fi
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"

      - name: Aleatorizar horário real de publicação (dentro da janela)
        # Feedback 2026-09-09: cron em horário EXATO todo santo dia é um dos
        # sinais que a política de "conteúdo inautêntico" do YouTube (jul/
        # 2026) usa pra identificar canal automatizado em escala. Um atraso
        # aleatório de até 50min desloca o horário real de publicação sem
        # sair da janela pretendida (os slots são 3h separados) e sem
        # atrapalhar teste manual (workflow_dispatch não espera).
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 3000))

      - name: Restaurar credenciais das APIs
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIKTOK_TOKEN_JSON: ${{ secrets.TIKTOK_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON_TENDENCIAS: ${{ secrets.YOUTUBE_TOKEN_JSON_TENDENCIAS }}
          TIKTOK_TOKEN_JSON_TENDENCIAS: ${{ secrets.TIKTOK_TOKEN_JSON_TENDENCIAS }}
        run: |
          echo "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
          echo "$TIKTOK_TOKEN_JSON" > tiktok_token.json
          if [ -n "$YOUTUBE_TOKEN_JSON_TENDENCIAS" ]; then
            echo "$YOUTUBE_TOKEN_JSON_TENDENCIAS" > token_tendencias.json
          fi
          if [ -n "$TIKTOK_TOKEN_JSON_TENDENCIAS" ]; then
            echo "$TIKTOK_TOKEN_JSON_TENDENCIAS" > tiktok_token_tendencias.json
          fi

      - name: Rodar pipeline (gerar -> montar -> publicar)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # So passa a chave da Replicate em run MANUAL (workflow_dispatch),
          # nunca em run automatica (schedule/cron) -- e paga por uso e o
          # Davi colocou so US$1 pra testar, precisa ficar fora do
          # fallback dos videos automaticos ate decidir usar de verdade
          # (pedido explicito 2026-09-10, medo de gastar sem perceber).
          REPLICATE_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.REPLICATE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          ARGS="--canal ${{ steps.conta.outputs.canal }}"
          if [ "${{ github.event.inputs.publicar }}" = "false" ]; then
            ARGS="$ARGS --sem-publicar"
          fi
          if [ -n "${{ github.event.inputs.roteiro_json }}" ]; then
            ARGS="$ARGS --roteiro-json ${{ github.event.inputs.roteiro_json }}"
          fi
          python src/pipeline_completo.py $ARGS

      - name: Persistir tokens atualizados (refresh token roda uma vez só)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sem GH_PAT_SECRETS configurado — tokens não foram persistidos. Próxima run pode falhar na autenticação do TikTok (o refresh token roda uma vez só)."
            exit 0
          fi
          [ -f tiktok_token.json ] && gh secret set TIKTOK_TOKEN_JSON --repo "${{ github.repository }}" < tiktok_token.json
          [ -f tiktok_token_tendencias.json ] && gh secret set TIKTOK_TOKEN_JSON_TENDENCIAS --repo "${{ github.repository }}" < tiktok_token_tendencias.json
          [ -f token.json ] && gh secret set YOUTUBE_TOKEN_JSON --repo "${{ github.repository }}" < token.json
          [ -f token_tendencias.json ] && gh secret set YOUTUBE_TOKEN_JSON_TENDENCIAS --repo "${{ github.repository }}" < token_tendencias.json

      - name: Guardar roteiro/vídeo gerado (sempre, mesmo se reprovado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: runs/
          retention-days: 14
