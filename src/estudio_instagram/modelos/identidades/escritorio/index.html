<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Escritório</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/falas.js"></script>
<script src="assets/roteiro.js"></script>
<style>
  @font-face { font-family: "Black"; src: url("assets/ArchivoBlack.ttf"); }
  @font-face { font-family: "Mono"; src: url("assets/JetBrainsMono.ttf"); font-weight: 100 900; }
  :root { --v: #e8314f; --c: #f1e9dc; --p: #0b0809; --t: #2fc9b4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--p); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Mono", monospace; color: var(--c);
    background: radial-gradient(ellipse 80% 45% at 50% 78%, rgba(232,49,79,.22), transparent 70%), radial-gradient(ellipse at 50% 30%, #17100f, #070505 75%); }
  .hud { position: absolute; inset: 34px; pointer-events: none; }
  .hud i { position: absolute; width: 44px; height: 44px; border: 3px solid rgba(241,233,220,.35); }
  .hud i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; } .hud i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; }
  .hud i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; } .hud i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; }
  .hud span { position: absolute; font: 600 22px "Mono"; letter-spacing: 2px; color: rgba(241,233,220,.45); }
  .rec { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--v); margin-right: 10px; }
  .scan { position: absolute; inset: 0; pointer-events: none; opacity: .5; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 5px); }
  .chao { position: absolute; left: -540px; right: -540px; top: 1250px; height: 1100px; transform: perspective(500px) rotateX(62deg); transform-origin: 50% 0;
    background-image: linear-gradient(rgba(232,49,79,.35) 2px, transparent 2px), linear-gradient(90deg, rgba(232,49,79,.35) 2px, transparent 2px);
    background-size: 120px 120px; -webkit-mask: linear-gradient(transparent, #000 30%); mask: linear-gradient(transparent, #000 30%); }
  .titulo { position: absolute; left: 40px; right: 40px; top: 150px; text-align: center; }
  .titulo .a { font: 400 62px/1 "Black"; color: var(--c); letter-spacing: 1px; }
  .titulo .b { font: 400 150px/1.02 "Black"; color: var(--v); letter-spacing: 2px; margin-top: 10px; white-space: nowrap; text-shadow: 0 0 30px rgba(232,49,79,.55), 0 0 80px rgba(232,49,79,.3); }
  .teal .titulo .b { color: var(--t); text-shadow: 0 0 30px rgba(47,201,180,.5); }
  .vermelha { background: #e23a55; } .vermelha .titulo .a, .vermelha .titulo .b { color: #fff; text-shadow: none; }
  .vermelha .chao { background-image: linear-gradient(rgba(255,255,255,.25) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.25) 2px, transparent 2px); }
  .vermelha .jan { border-color: #111; } .vermelha .jan .cab { background: #111; }
  .cena { position: absolute; inset: 0; opacity: 0; }
  .num { position: absolute; left: 90px; top: 520px; font: 400 96px "Black"; color: var(--v); }
  .jan { position: absolute; border: 3px solid var(--v); background: #0d0a0b; box-shadow: 0 0 0 1px #000, 0 30px 80px rgba(0,0,0,.6); }
  .jan .cab { display: flex; justify-content: space-between; padding: 10px 18px; background: var(--v); color: #fff; font: 700 24px "Mono"; letter-spacing: 1px; }
  .jan .cab::after { content: "• • •"; }
  .lin { display: flex; justify-content: space-between; gap: 20px; padding: 14px 22px; border-bottom: 2px solid #2a1a1c; font: 600 30px "Mono"; }
  .lin.tot { border: 0; font-size: 38px; font-weight: 800; color: #fff; }
  .fig { position: absolute; } .fig svg { width: 100%; height: 100%; overflow: visible; }
  .fig.close { width: 560px; height: 711px; } .fig.vaga { opacity: .22; }
  .tag { position: absolute; padding: 4px 12px; background: var(--t); color: #001; font: 800 22px "Mono"; white-space: nowrap; }
  .cel { position: absolute; left: 290px; top: 540px; width: 500px; height: 900px; border: 5px solid var(--c); border-radius: 64px; background: #050404; }
  .cel .hora { margin-top: 40px; text-align: center; font: 800 132px "Mono"; color: #fff; }
  .cel .dia { text-align: center; font: 600 28px "Mono"; color: #aaa; letter-spacing: 2px; margin-top: 70px; }
  .notif { margin: 26px 26px 0; padding: 20px; border: 2px solid #3a2a2c; border-radius: 22px; background: #141011; font: 600 26px/1.35 "Mono"; }
  .notif b { color: var(--v); }
  .barra { height: 34px; margin: 26px 22px; border: 3px solid var(--v); } .barra div { height: 100%; width: 0; background: var(--v); }
  .md { padding: 0 22px 22px; font: 600 30px/1.55 "Mono"; color: var(--c); } .md div:first-child { color: var(--v); font-size: 36px; }
  .arq { position: absolute; width: 400px; height: 290px; }
  .arq .ic { margin: 28px auto 0; width: 110px; height: 130px; border: 4px solid var(--c); }
  .ok { position: absolute; right: 18px; bottom: 16px; width: 62px; height: 62px; background: var(--t); color: #001; font: 800 44px/62px "Mono"; text-align: center; }
  .chat { padding: 22px; font: 600 30px/1.45 "Mono"; }
  .chat .eu { margin-left: auto; width: fit-content; max-width: 80%; padding: 14px 20px; background: #2a1a1c; margin-bottom: 18px; }
  .chat .ia { padding: 14px 20px; border-left: 6px solid var(--t); }
  .papel { position: absolute; left: 190px; top: 560px; width: 700px; padding: 40px; background: var(--c); color: #1a1414; font: 600 30px/1.5 "Mono"; transform: rotate(-2deg); box-shadow: 0 40px 80px rgba(0,0,0,.6); }
  .papel .r { font: 800 40px "Mono"; word-break: break-all; } .papel .s { color: #6a5a5a; margin-top: 12px; }
  .papel .est { margin-top: 24px; font: 800 46px "Mono"; color: #b8861b; }
  .selo { position: absolute; padding: 8px 26px; border: 7px solid var(--v); color: var(--v); font: 400 76px "Black"; transform: rotate(-10deg); }
  .cursor { position: absolute; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-bottom: 64px solid #fff; transform: rotate(-30deg); filter: drop-shadow(0 4px 6px #000); }
  .comp { position: absolute; left: 110px; width: 860px; border: 3px solid var(--c); background: #0d0a0b; padding: 22px 26px; font: 700 34px "Mono"; display: flex; align-items: center; gap: 18px; }
  .comp .q { width: 46px; height: 46px; background: var(--c); } .comp .bt { margin-left: auto; padding: 8px 18px; background: var(--v); color: #fff; font-size: 24px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__DURACAO__">
  <div class="scan"></div>
  <div id="cenas" class="clip" data-start="0" data-duration="__DURACAO__" data-track-index="1" style="position:absolute;inset:0"></div>
  <div class="hud"><i></i><i></i><i></i><i></i>
    <span style="left:60px;top:8px">ESCRITÓRIO // SEC <b id="sec">01</b></span><span style="right:60px;top:8px">URSULINO.IA // 24H</span>
    <span style="left:60px;bottom:8px"><i class="rec" style="position:static;border:0"></i>MAX ONLINE</span><span style="right:60px;bottom:8px" id="tc">00:00:00:00</span></div>
  <audio src="assets/voz.wav" data-start="0" data-duration="__DURACAO__" data-track-index="9" data-volume="1"></audio>
  <audio src="assets/lofi.wav" data-start="0" data-duration="__DURACAO__" data-track-index="8" data-volume="0.14"></audio>
</div>
<script>
// Identidade "escritório" (referência: @omagodoalgoritmo). O roteiro (window.ROT) escolhe, para cada frase, um tipo
// de cena do acervo: time, folha, celular, conversor, grade, chat, cracha e comenta. Cores, número da cena, objeto
// na mão do Max e enquadramento variam por posição, então dois vídeos nunca saem com as mesmas cenas.
const E = window.ESQ, R = window.ROT, F = E.falas, FIM = E.duracao, C = R.cenas;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const mil = (n) => n >= 1000 ? (n / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil" : String(n);

const PROP = {
  nada: "",
  aceno: `<path d="M198 222 L236 150" stroke="#111" stroke-width="22" stroke-linecap="round"/><rect x="224" y="124" width="26" height="30" fill="#f1e9dc"/>`,
  lupa: `<path d="M198 222 L228 168" stroke="#111" stroke-width="22" stroke-linecap="round"/><rect x="216" y="150" width="24" height="24" fill="#f1e9dc"/><path d="M234 150 L246 128" stroke="#f1e9dc" stroke-width="7"/><circle cx="254" cy="110" r="22" fill="rgba(241,233,220,.15)" stroke="#f1e9dc" stroke-width="6"/>`,
  cafe: `<path d="M198 222 L222 186" stroke="#111" stroke-width="22" stroke-linecap="round"/><rect x="210" y="150" width="34" height="40" fill="#f1e9dc"/><path d="M244 160 q14 6 0 20" stroke="#f1e9dc" stroke-width="5" fill="none"/>`,
  cel: `<path d="M198 222 L224 170" stroke="#111" stroke-width="22" stroke-linecap="round"/><rect x="210" y="112" width="36" height="64" rx="5" fill="#111" stroke="#f1e9dc" stroke-width="4"/><rect x="216" y="120" width="24" height="40" fill="#e8314f"/>`,
};
const CHAPEU = {
  bone: (c) => `<rect x="66" y="34" width="128" height="36" fill="${c}"/><rect x="150" y="60" width="66" height="12" fill="${c}"/>`,
  fone: (c) => `<path d="M64 110 Q64 18 130 18 Q196 18 196 110" stroke="${c}" stroke-width="12" fill="none"/><rect x="52" y="92" width="26" height="46" fill="${c}"/><rect x="182" y="92" width="26" height="46" fill="${c}"/>`,
  asas: (c) => `<path d="M70 90 L20 60 L36 90 L10 96 L60 110 Z M190 90 L240 60 L224 90 L250 96 L200 110 Z" fill="#f1e9dc"/><rect x="70" y="40" width="120" height="16" fill="${c}"/>`,
  cabelo: (c) => `<path d="M66 70 L66 40 L110 30 L194 40 L194 70 Z" fill="${c}"/>`,
};
const FIG = (cor, chapeu, prop) => `<svg viewBox="0 0 260 330"><g class="corpo"><path d="M40 330 L60 215 Q130 190 200 215 L220 330 Z" fill="#111" stroke="#f1e9dc" stroke-width="5"/>
  <path d="M108 205 L130 250 L152 205 Z" fill="#f1e9dc"/><path d="M124 214 L136 214 L142 290 L130 305 L118 290 Z" fill="#e8314f"/><g class="braco">${PROP[prop]}</g></g>
  <g class="cab"><rect x="70" y="40" width="120" height="150" fill="#111" stroke="#f1e9dc" stroke-width="5"/>${CHAPEU[chapeu](cor)}
  <g class="olhos"><rect x="96" y="100" width="18" height="30" fill="#f1e9dc"/><rect x="146" y="100" width="18" height="30" fill="#f1e9dc"/></g>
  <rect x="112" y="152" width="36" height="6" fill="#f1e9dc"/></g></svg>`;
const fig = (cls, estilo, cor, chapeu, prop) => `<div class="fig ${cls}" style="${estilo}">${FIG(cor, chapeu, prop)}</div>`;
const jan = (cab, corpo, estilo) => `<div class="jan" style="${estilo}"><div class="cab">${esc(cab)}</div>${corpo}</div>`;

// Max fica alternando de lado e de objeto; a cena 4 vira vermelha cheia, as pares (exceto 0) ganham título verde-água
const PROPS = ["aceno", "lupa", "cafe", "cel"];
const max = (i) => fig("close", `left:${i % 2 ? -40 : 560}px;top:1250px`, "#e8314f", "bone", PROPS[i % 4]);
const CENA = {
  time: (c) => { const nomes = (c.nomes || ["MAX"]).slice(0, 4), CH = ["bone", "fone", "asas", "cabelo"];
    const larg = 1000 / nomes.length;
    return nomes.map((n, k) => fig(k ? "vaga" : "", `left:${40 + k * larg + larg / 2 - 140}px;top:${k ? 900 : 820}px;width:${k ? 240 : 300}px;height:${k ? 300 : 380}px`,
      k ? "#2fc9b4" : "#e8314f", CH[k], k ? "nada" : "aceno") + `<div class="tag" style="left:${40 + k * larg + larg / 2 - 70}px;top:${k ? 860 : 780}px">${esc(n)} // 0${k + 1}</div>`).join(""); },
  folha: (c, i) => jan(c.cabecalho || "FOLHA", (c.linhas || []).slice(0, 4).map(([a, b]) => `<div class="lin x">${esc(a)}<span>${esc(b)}</span></div>`).join("")
    + (c.total ? `<div class="lin tot x">${esc(c.total[0])}<span>${esc(c.total[1])}</span></div>` : ""), "left:140px;top:560px;width:800px") + max(i),
  celular: (c) => `<div class="cel"><div class="dia">AGORA</div><div class="hora">00:43</div>${(c.notificacoes || []).slice(0, 2)
    .map((n) => `<div class="notif x"><b>${esc(n.de)}</b> · agora<br>${esc(n.texto)}</div>`).join("")}</div>`,
  conversor: (c, i) => `<div class="num">0${i + 1}</div>` + jan(c.janela || "MAX // TAREFA", `<div class="barra"><div class="pb"></div></div><div class="md">${(c.linhas || []).slice(0, 5)
    .map((l) => `<div class="x">${esc(l)}</div>`).join("")}</div>`, "left:140px;top:660px;width:800px") + max(i),
  grade: (c, i) => (c.itens || []).slice(0, 4).map((t, k) => jan(`0${k + 1} // ${t}`, `<div class="ic"></div><div class="ok">✓</div>`,
    `left:${k % 2 ? 560 : 120}px;top:${k < 2 ? 580 : 920}px`).replace('class="jan"', 'class="jan arq x"')).join("") + max(i),
  chat: (c, i) => jan("CHAT // IA", `<div class="chat"><div class="eu x">${esc(c.pergunta)}</div><div class="ia x">${esc(c.resposta)}</div></div>`, "left:140px;top:580px;width:800px")
    + `<div class="cursor" style="left:760px;top:1000px"></div>` + max(i),
  cracha: (c, i) => `<div class="papel"><div style="font-size:24px;color:#8a7a7a">CRACHÁ // FUNCIONÁRIO 01</div><div class="r">${esc(R.repo.nome)}</div>
    <div class="s">${esc((R.repo.descricao || "").slice(0, 110))}</div><div class="est">★ <span class="n">0</span> estrelas</div></div>
    <div class="selo" style="left:560px;top:980px">GRÁTIS</div>` + max(i),
  comenta: (c, i) => `<div class="comp" style="top:620px"><div class="q"></div><span class="tx"></span><span class="bt">PUBLICAR</span></div>`
    + jan("DIRECT // NOVA MENSAGEM", `<div class="chat"><b style="color:var(--v)">@ursulino.ia</b><br>Te mandei o link e o passo a passo →</div>`, "left:110px;top:800px;width:860px").replace('class="jan"', 'class="jan dm"')
    + `<div class="cursor" style="left:860px;top:700px"></div>` + fig("close", "left:260px;top:1250px", "#e8314f", "bone", "cel"),
};
const raiz = $("#cenas");
C.forEach((c, i) => {
  const d = document.createElement("div");
  d.className = "cena" + (i === 4 ? " vermelha" : i % 2 === 0 && i > 0 && c.tipo !== "comenta" ? " teal" : "");
  d.id = "c" + i;
  d.innerHTML = `<div class="chao"></div><div class="titulo"><div class="a">${esc(c.titulo_a)}</div><div class="b">${esc(c.titulo_b)}</div></div>` + (CENA[c.tipo] || CENA.chat)(c, i);
  raiz.appendChild(d);
});

const tl = gsap.timeline({ paused: true });
F.forEach((f, i) => {
  const ini = i === 0 ? 0 : f.t - 0.1, fim = i + 1 < F.length ? F[i + 1].t - 0.1 : FIM, dur = fim - ini;
  const c = $("#c" + i), a = $(".titulo .a", c), b = $(".titulo .b", c), tipo = C[i].tipo;
  tl.set(c, { opacity: 1 }, ini).set(c, { opacity: 0 }, fim).set("#sec", { textContent: String(i + 1).padStart(2, "0") }, ini);
  // tamanho pela contagem de letras (a fonte pode não ter carregado na hora de medir); Archivo Black ~0,8 em por letra
  gsap.set(b, { fontSize: Math.min(150, 1000 / (0.8 * Math.max(1, b.textContent.length))) });
  gsap.set(a, { fontSize: Math.min(62, 1000 / (0.75 * Math.max(1, a.textContent.length))) });
  if (i > 0) {
    tl.fromTo(a, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: .22, ease: "power2.out" }, ini)
      .fromTo(b, { scale: 1.35, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: .28, ease: "power4.out" }, ini + .1)
      .fromTo("#root", { filter: "brightness(1.8) contrast(1.2)" }, { filter: "brightness(1) contrast(1)", duration: .18, immediateRender: false }, ini);
    $$(".jan:not(.arq):not(.dm), .cel, .papel", c).forEach((el) => tl.fromTo(el, { scaleY: .02, opacity: 0 },
      { keyframes: [{ scaleY: .02, opacity: 1, duration: .08 }, { scaleY: 1, duration: .22, ease: "power3.out" }] }, ini + .05));
  }
  $$(".fig", c).forEach((el, k) => {
    if (i > 0) tl.fromTo(el, { y: 220 }, { y: 0, duration: .4, ease: "back.out(1.5)" }, ini + .15 + k * .06);
    tl.to($(".cab", el), { y: -6, duration: .45, yoyo: true, repeat: Math.floor(dur / .45), ease: "sine.inOut" }, ini);
    tl.to($(".braco", el), { rotation: -8, transformOrigin: "198px 222px", duration: .35, yoyo: true, repeat: Math.floor(dur / .35), ease: "sine.inOut" }, ini);
    tl.to($(".olhos", el), { scaleY: .1, transformOrigin: "50% 50%", duration: .06, yoyo: true, repeat: 1 }, ini + .9);
  });
  // itens de tela entram um a um ao longo da frase
  const itens = $$(".x", c), passo = Math.min(.5, (f.d - .3) / Math.max(1, itens.length));
  itens.forEach((el, k) => tl.fromTo(el, { opacity: i === 0 ? 1 : 0, x: -20 }, { opacity: 1, x: 0, duration: .18, immediateRender: i > 0 }, f.t + .25 + k * passo));
  $$(".ok", c).forEach((el, k) => tl.fromTo(el, { scale: 0 }, { scale: 1, duration: .2, ease: "back.out(3)" }, f.t + .45 + k * passo));
  const pb = $(".pb", c); if (pb) tl.fromTo(pb, { width: "0%" }, { width: "100%", duration: Math.min(1.2, f.d * .5), ease: "power2.inOut" }, f.t + .1);
  const cur = $(".cursor", c); if (cur) tl.fromTo(cur, { x: -200, y: 260 }, { x: 0, y: 0, duration: .55, ease: "power2.out" }, f.t + .2);
  if (tipo === "cracha") {
    const n = { v: 0 }; tl.to(n, { v: R.repo.estrelas, duration: 1.1, ease: "power3.out", onUpdate: () => $(".n", c).textContent = mil(Math.round(n.v)) }, f.t + .3);
    tl.fromTo($(".selo", c), { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: .2, ease: "power4.in" }, f.t + f.d * .7)
      .fromTo(c, { x: -10 }, { x: 0, duration: .25, ease: "rough({strength: 3, points: 10})" }, f.t + f.d * .7 + .2);
  }
  if (tipo === "comenta") {
    const t = { n: 0 }, P = R.palavra;
    tl.to(t, { n: P.length, duration: .7, ease: "none", onUpdate: () => $(".tx", c).textContent = P.slice(0, Math.round(t.n)) }, f.t + .3)
      .to($(".bt", c), { scale: .85, yoyo: true, repeat: 1, duration: .08 }, f.t + 1.15)
      .fromTo($(".dm", c), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .35, ease: "back.out(2)" }, f.t + 1.4);
  }
});
const rel = { t: 0 }; tl.to(rel, { t: FIM, duration: FIM, ease: "none", onUpdate: () => { const s = rel.t;
  $("#tc").textContent = `00:00:${String(Math.floor(s)).padStart(2, "0")}:${String(Math.floor((s % 1) * 30)).padStart(2, "0")}`; } }, 0);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
</script>
</body>
</html>
